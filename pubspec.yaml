name: fit_flow

description: A Flutter + Firebase gym management app with class booking, memberships, and admin features.

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.1
  firebase_crashlytics: ^4.3.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  cloud_functions: ^5.0.0
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  mobile_scanner: ^6.0.0
  fl_chart: ^0.69.0
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.10
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.0.2

flutter:
  uses-material-design: true

dependency_overrides:
  permission_handler_android: 13.0.1
